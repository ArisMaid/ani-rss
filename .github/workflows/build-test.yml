name: build-test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: '11.22.0'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ani-rss-ui/pnpm-lock.yaml
      - name: Build with Project
        run: |
          mvn -B verify \
              -Pci \
              --file pom.xml
      - name: Frontend isolated verification
        working-directory: ani-rss-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm test -- --run
          W7_DIST_DIR="$RUNNER_TEMP/ani-rss-w7-dist-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export W7_DIST_DIR
          pnpm exec vite build --outDir "$W7_DIST_DIR" --emptyOutDir false
          BUNDLE_OUTPUT_DIR="$W7_DIST_DIR" pnpm check:bundle
          W7_DIST_DIR="$W7_DIST_DIR" \
            W7_REPORT_PATH="$RUNNER_TEMP/ani-rss-w7-browser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" \
            bash scripts/w7-browser-smoke.sh
