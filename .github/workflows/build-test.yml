name: build-test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: '11.22.0'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ani-rss-ui/pnpm-lock.yaml
      - name: Build with Project
        run: |
          mvn -B verify \
              -Pci \
              --file pom.xml
      - name: Frontend isolated verification
        working-directory: ani-rss-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build:verify
          pnpm check:bundle
