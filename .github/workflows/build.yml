name: build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Project
        run: |
          version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f pom.xml)
          test "$GITHUB_REF" = "refs/tags/v$version"
          bash ./package.sh
          echo "version=v$version" >> "$GITHUB_ENV"
          cd ani-rss-application/target
          sha256sum ani-rss.jar ani-rss.exe > SHA256SUMS
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.version }}
          body_path: UPDATE.md
          tag_name: ${{ env.version }}
          draft: true
          append_body: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ./ani-rss-application/target/ani-rss.jar
            ./ani-rss-application/target/ani-rss.exe
            ./ani-rss-application/target/SHA256SUMS
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Detect Docker Hub credentials
        id: docker_hub
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [[ -n "$DOCKER_USERNAME" && -n "$DOCKER_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to Docker Hub
        if: steps.docker_hub.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image (temurin)
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.version }}
          tags: |
            ghcr.io/arismaid/ani-rss:latest
            ghcr.io/arismaid/ani-rss:${{ env.version }}
            ${{ steps.docker_hub.outputs.enabled == 'true' && 'arismaid/ani-rss:latest' || '' }}
            ${{ steps.docker_hub.outputs.enabled == 'true' && format('arismaid/ani-rss:{0}', env.version) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push Docker image (openj9)
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./docker/Dockerfile-openj9
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.version }}
          tags: |
            ghcr.io/arismaid/ani-rss:openj9
            ghcr.io/arismaid/ani-rss:${{ env.version }}-openj9
            ${{ steps.docker_hub.outputs.enabled == 'true' && 'arismaid/ani-rss:openj9' || '' }}
            ${{ steps.docker_hub.outputs.enabled == 'true' && format('arismaid/ani-rss:{0}-openj9', env.version) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push Docker image (arm32v7)
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./docker/Dockerfile-arm32v7
          platforms: linux/arm/v7
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.version }}
          tags: |
            ghcr.io/arismaid/ani-rss:arm32v7
            ghcr.io/arismaid/ani-rss:${{ env.version }}-arm32v7
            ${{ steps.docker_hub.outputs.enabled == 'true' && 'arismaid/ani-rss:arm32v7' || '' }}
            ${{ steps.docker_hub.outputs.enabled == 'true' && format('arismaid/ani-rss:{0}-arm32v7', env.version) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$version" --repo "$GITHUB_REPOSITORY" --draft=false
